[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citra"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "cryptography>=50.0.0",
    "furo>=2025.12.19",
    "jsonschema>=4.0",
    "markdown>=3.10.3",
    "openai>=3.3.1",
    "openpyxl>=3.1.5",
    "playwright>=1.50",
    "prompt-toolkit>=3.0",
    "pypdf>=6,<7",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "sentencepiece>=0.2.2",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.1",
    "tomlkit>=0.15.1",
    "types-jsonschema>=4.26.0.20260518",
    "types-markdown>=3.10.2.20260712",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
